spring.docker.compose.enabled=true
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true

spring.config.import=optional:file:.env[.properties]

# Blob storage config \u2014 resolved from env vars in both profiles
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING}
azure.storage.qrcontainer-string=${AZURE_STORAGE_QR_CONNECTION}
azure.storage.imagecontainer-string=${AZURE_STORAGE_IMAGE_CONNECTION}