azure.storage.imagecontainer-string=${AZURE_STORAGE_IMAGECONNECTION}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.sql.init.mode=never


spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true

# Blob storage config \u2014 resolved from env vars in both profiles
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING}
azure.storage.qrcontainer-string=${AZURE_STORAGE_QR_CONNECTION}
azure.storage.imagecontainer-string=${AZURE_STORAGE_IMAGE_CONNECTION}