spring.docker.compose.enabled=false

spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:3306/${MYSQL_DB}?useSSL=true&requireSSL=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

# validate (not update) in production \u2014 schema changes must be intentional migrations, not accidental startups
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.jpa.show-sql=false
#spring.jpa.hibernate.ddl-auto=update

# Server binds to what Azure App Service expects
server.port=8080

# Auth via Managed Identity \u2014 no connection string in Azure
azure.storage.account-name=${AZURE_STORAGE_ACCOUNT}
azure.storage.qrcontainer-name=${AZURE_STORAGE_QRCONTAINER}
azure.storage.imagecontainer-name=${AZURE_STORAGE_IMAGECONTAINER}